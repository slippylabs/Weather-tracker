[Service]
# Soft then hard cap. Peak observed ~80M; a cold collection is a 9-thread pool
# of HTTP waits and app.py caps those at COLD_MAX=3 concurrent, so this only
# trips on a real leak. MemoryHigh throttles (reclaims hard); MemoryMax kills,
# and Restart=on-failure brings it back -- the forecast cache is on disk.
MemoryHigh=384M
MemoryMax=768M
MemoryAccounting=true
