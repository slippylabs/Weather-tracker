# Copy of security-headers.conf with geolocation=(self), for vhosts whose page
# uses navigator.geolocation (weather.slippylabs.com "Use my location").
# Keep in sync with security-headers.conf; add_header in a block replaces
# inherited ones, so this is included INSTEAD of that snippet, never alongside.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), interest-cohort=()" always;

# Report-only for now. The tool sites under projects.slippylabs.com are heavily
# inline-script/style based, so an enforcing policy would break them all at once.
# Collect violations first, tighten per-site, then promote to the enforcing
# Content-Security-Policy header.
#
# 'unsafe-inline'/'unsafe-eval' are present deliberately: they reflect what the
# sites do today. The value of this pass is frame-ancestors, object-src and
# base-uri, which cost nothing and close off clickjacking/base-tag injection.
#
# KNOWN CROSS-ORIGIN INCLUDES, i.e. what already reports against script-src
# 'self' / style-src 'self' and will have to be allowed before this can be
# promoted to enforcing. All three are first-party, served from the root vhost,
# and are absolute URLs because nginx here has no alias or shared location --
# an absolute URL to slippylabs.com is the only way one file can serve every
# subdomain:
#   https://slippylabs.com/deck/deck.js    the floating player (~70 pages)
#   https://slippylabs.com/a11y/a11y.js    the accessibility panel (19 pages)
#   https://slippylabs.com/a11y/a11y.css   its stylesheet (19 pages)
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' wss: https:; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
