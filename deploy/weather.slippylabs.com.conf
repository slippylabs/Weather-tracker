server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name weather.slippylabs.com;
    include snippets/security-headers.conf;
    include snippets/block-dotfiles.conf;

    ssl_certificate     /etc/letsencrypt/live/slippylabs-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/slippylabs-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/weather.slippylabs.com;
    index index.html;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8028/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # A cold location has to talk to nine upstream forecast services
        # before it can answer; that runs to ~10s on a slow one.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~* \.(css|js)$ {
        # add_header in a location drops every inherited header, so the
        # security snippet has to be repeated in each one.
        include snippets/security-headers.conf;
        try_files $uri =404;
        # 5 min fresh, then serve stale while revalidating. Deliberately not
        # immutable, matching the rest of the estate.
        add_header Cache-Control "max-age=300, stale-while-revalidate=86400" always;
    }

    location ~* \.(png|jpe?g|webp|gif|ico|svg|avif|woff2?|ttf|otf|eot)$ {
        include snippets/security-headers.conf;
        try_files $uri =404;
        # 30d, not immutable: capture_shots.py rewrites og-image.png in place
        # under the same filename with no ?v= buster.
        add_header Cache-Control "max-age=2592000, stale-while-revalidate=86400" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
